# Type-checks, checks formatting and builds the UI on each push and pull request.
#
# On pushes to master and on version tags (v1.0.0), once the checks pass, the Docker image is
# published to GitHub Container Registry as ghcr.io/<owner>/heaped-and-stacked-ui, tagged:
#   sha-<commit>   every publish: what a deploy points at, and what a rollback goes back to
#   latest         the newest commit on master
#   1.0.0          a version tag
# One image for every environment: the container takes its addresses when it starts (API_URL and
# SITE_URL), so the image tested in the test environment is the one promoted to production.
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - name: Formatting
        run: npx prettier --check src
      - run: npm run build

      - name: Known vulnerabilities in dependencies (high and above)
        run: npm audit --omit=dev --audit-level=high

      - name: Build the Docker image (no push)
        if: github.event_name == 'pull_request'
        run: docker build -t heaped-and-stacked-ui:ci .

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
